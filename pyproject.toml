[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "universal-webui-bridge"
version = "2.1.0"
description = "Drive any web-based LLM (ChatGPT, Claude, Grok, OpenWebUI, LM Studio, ...) from Python or HTTP. Logs in once, stays logged in via a persistent browser profile."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Universal WebUI Bridge contributors"}]
keywords = ["llm", "bridge", "playwright", "webui", "chat", "automation", "agent", "chatgpt", "claude", "grok"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "playwright>=1.40.0",
    "aiohttp>=3.9.0",
    "streamlit>=1.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "black>=23.0",
    "ruff>=0.1.0",
]

[project.scripts]
webui-bridge = "webui_bridge_v2.cli:main"
llm-bridge   = "webui_bridge_v2.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100
